name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Ensure Environment Configuration
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Generate Debug Keystore if Missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Align and re-sign Debug APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="app/build/outputs/apk/debug/app-debug-aligned.apk"
          SIGNED="app/build/outputs/apk/debug/app-debug-signed.apk"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
          printf '%s' 'android' > /tmp/debug-keystore-pass
          "$BUILD_TOOLS/apksigner" sign \
            --ks debug.keystore \
            --ks-pass file:/tmp/debug-keystore-pass \
            --key-pass file:/tmp/debug-keystore-pass \
            --ks-key-alias androiddebugkey \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$SIGNED"
          mv "$SIGNED" "$APK"
          rm -f "$ALIGNED" /tmp/debug-keystore-pass

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
