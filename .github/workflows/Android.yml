name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Muddasir DJ,O=Muddasir,C=PK"
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "STORE_PASSWORD=android"
            echo "KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build release APK and App Bundle
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Check music asset payload
        run: |
          count="$(find music_preload/src/main/assets -type f ! -name bundled_music_manifest.json | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "::warning::Music asset pack code/manifest is configured, but the 70-track ZIP payload is not stored in the public Git repository."
          else
            echo "Music asset payload files: $count"
          fi

      - name: Verify installable APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee /tmp/apk-badging.txt

          if grep -q "testOnly='true'" /tmp/apk-badging.txt; then
            echo "ERROR: APK is marked testOnly=true"
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"

      - name: Verify App Bundle and asset pack wiring
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -l "$AAB" | grep -q "music_preload/manifest/AndroidManifest.xml"
          unzip -l "$AAB" | grep -q "music_preload/assets/bundled_music_manifest.json"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
