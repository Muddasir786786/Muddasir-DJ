name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v               -keystore debug.keystore               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -storepass android               -keypass android               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
